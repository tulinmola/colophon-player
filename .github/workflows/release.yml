name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run check
      - run: npm run dist

      - run: npm publish --provenance --access public

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp dist/colophon-player.js "colophon-player-$version.js"
          cp dist/colophon-player.css "colophon-player-$version.css"
          js_sri="sha384-$(openssl dgst -sha384 -binary dist/colophon-player.js | openssl base64 -A)"
          css_sri="sha384-$(openssl dgst -sha384 -binary dist/colophon-player.css | openssl base64 -A)"
          {
            echo '```html'
            echo "<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/colophon-player@$version/dist/colophon-player.css\" integrity=\"$css_sri\" crossorigin=\"anonymous\" />"
            echo "<script type=\"module\" src=\"https://cdn.jsdelivr.net/npm/colophon-player@$version/dist/colophon-player.js\" integrity=\"$js_sri\" crossorigin=\"anonymous\"></script>"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "colophon-player-$version.js" "colophon-player-$version.css" --title "$GITHUB_REF_NAME" --notes-file notes.md
